# Spore-Photos — self-contained stack: API (+ web UI), public share, Postgres.
#
#   cd docker
#   cp .env.example .env      # set PG_PASSWORD (and LIBRARY_PATH if you like)
#   docker compose up -d --build
#
# Then open http://<host>:4051 and enter the setup token printed by:
#   docker compose logs api | grep -i "setup token"
#
# Only port 4051 is published; the API proxies /share/* to the share service,
# so one port serves the UI, the API and public share links.

name: spore-photos

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: spore-photos:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - ${LIBRARY_PATH:-./library}:/data/photos

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${PG_DATABASE:-spore_photos}
      POSTGRES_USER: ${PG_USER:-spore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *app
    command: ["api"]
    environment:
      PORT: "4051"
      PG_HOST: db
      PICTURES_ROOT: /data/photos
      # Where the /share proxy should send share links (the service below).
      SHARE_SERVER_HOST: share
      SHARE_SERVER_PORT: "4052"
    ports:
      - "${APP_PORT:-4051}:4051"
    volumes:
      - ${LIBRARY_PATH:-./library}:/data/photos
      # The APK a build writes is served straight out of here, so publishing one
      # needs no image rebuild — the builder profile writes into this directory on
      # the host, and the API reads it live. The directory is shipped by the
      # repository (a .gitkeep keeps it present); Docker creates a *missing*
      # bind-mount source as root, and then the builder, running as PUID, cannot
      # write into it. The `volumes:` list is repeated here because a service-level
      # key replaces the anchor's rather than merging with it.
      - ../spore-photos-client/public/apk:/app/spore-photos-client/public/apk
    depends_on:
      db:
        condition: service_healthy
      share:
        condition: service_started

  share:
    <<: *app
    command: ["share"]
    environment:
      PORT: "4052"
      PG_HOST: db
      PICTURES_ROOT: /data/photos
    depends_on:
      db:
        condition: service_healthy
    # No published port on purpose: reachable only through the API's /share
    # proxy. Uncomment to expose it directly (e.g. an external proxy that
    # routes /share separately).
    # ports:
    #   - "${SHARE_PORT:-4052}:4052"

  # ─── Android APK builder (opt-in) ──────────────────────────────────────────
  # Building an APK needs a JDK and the Android SDK (~2.5 GB). This service
  # carries them so the host needs nothing installed — but it is behind a
  # profile, so `docker compose up` never pulls it and the app image stays
  # Node-only.
  #
  #   docker compose --profile build run --rm builder --check
  #   docker compose --profile build run --rm builder build
  #
  # The repository is bind-mounted, so your signing key (server/data/) and the
  # finished APK (spore-photos-client/public/apk/) are the host's own files.
  # It runs as PUID:PGID for the same reason: an APK owned by root is a small
  # annoyance that is much easier to avoid than to clean up.
  builder:
    profiles: ["build"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.builder
    image: spore-photos-builder:latest
    working_dir: /repo
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Use an all-writable HOME so Gradle can cache inside the container.
      HOME: /tmp
      # Pass the keystore passphrase for this run, or type it at the prompt:
      #   SPORE_KEYSTORE_PASS=… docker compose --profile build run --rm builder build
      SPORE_KEYSTORE_PASS: ${SPORE_KEYSTORE_PASS:-}
    volumes:
      - ..:/repo
      # A persistent Gradle cache. Without one, every build re-downloads the
      # Android Gradle Plugin and its dependencies — the slow part of a first
      # build. A named volume rather than a bind mount, so Docker owns the
      # directory's ownership and there is no host directory to create first.
      - spore-gradle-cache:/tmp/.gradle
    # Gradle is memory-hungry; uncomment to keep it from upsetting a small host.
    # mem_limit: 4g

volumes:
  pgdata:
  spore-gradle-cache:

